name: Android — APK de teste + AAB Play Store

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Validar e empacotar Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # O projeto migrou do Capacitor 5 para o 8 nesta versão. O lockfile deve
      # ser regenerado/commitado após o primeiro npm install local bem-sucedido.
      - name: Instalar dependências
        id: deps
        run: |
          if [ -f package-lock.json ]; then
            echo "lock_generated=false" >> "$GITHUB_OUTPUT"
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json ainda não existe; usando npm install nesta execução. O lockfile gerado será publicado como artefato para ser versionado."
            npm install --no-audit --no-fund
            echo "lock_generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar package-lock gerado
        if: ${{ steps.deps.outputs.lock_generated == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: saldoreal-package-lock
          path: package-lock.json
          retention-days: 7

      - name: Testes unitários
        run: npm run test:unit

      - name: Build web de produção
        run: npm run build

      - name: Criar e sincronizar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gerar ícones e splash Android
        run: |
          npx @capacitor/assets generate --android --assetPath assets \
            --iconBackgroundColor '#2D0B5E' \
            --iconBackgroundColorDark '#160B2A' \
            --splashBackgroundColor '#2D0B5E' \
            --splashBackgroundColorDark '#160B2A'

      - name: Aplicar configuração Android do Saldo Real
        run: node scripts/configure-android.mjs

      - name: Validar compatibilidade dos temas Android
        run: node scripts/validate-android-theme.mjs

      - name: Preparar chave de upload para release
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/saldoreal-upload.jks
          cat > android/keystore.properties <<PROPS
          storeFile=saldoreal-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Dar permissão ao Gradlew
        run: chmod +x android/gradlew

      - name: Cache do Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Lint Android
        working-directory: android
        run: ./gradlew lintDebug --no-daemon

      - name: Build APK debug para testes
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build AAB release assinado
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Publicar APK de teste
        uses: actions/upload-artifact@v7
        with:
          name: saldoreal-beta9-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar AAB para Play Store
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: saldoreal-beta9-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Avisar quando a assinatura ainda não foi configurada
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::APK de teste gerado, mas o AAB de release não foi criado porque os secrets da chave de upload ainda não foram configurados. Consulte RELEASE_ANDROID.md."
